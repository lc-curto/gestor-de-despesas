name: CI e Deploy - Alwaysdata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meu-bolso-production
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meu_bolso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, xml, ctype, fileinfo, openssl, tokenizer
          coverage: none
          tools: composer:v2

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Verificar projeto
        run: npm run check

      - name: Compilar assets
        run: npm run build

      - name: Executar testes Laravel
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: meu_bolso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: composer test

      - name: Preparar dependências de produção
        if: github.event_name != 'pull_request'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Configurar acesso SSH
        if: github.event_name != 'pull_request'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | awk '$2 == "ecdsa-sha2-nistp256" { print }' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Criar nova release no servidor
        if: github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.ALWAYSDATA_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE="releases/release-${DEPLOY_SHA:0:7}"
          ssh -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ecdsa-sha2-nistp256 "${SSH_USER}@${SSH_HOST}" "mkdir -p \"\$HOME/$RELEASE\""
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            -e "ssh -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ecdsa-sha2-nistp256" \
            ./ "${SSH_USER}@${SSH_HOST}:~/$RELEASE/"

          ssh -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ecdsa-sha2-nistp256 "${SSH_USER}@${SSH_HOST}" "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail
          RELEASE_PATH="$HOME/$1"

          test -f "$RELEASE_PATH/artisan"
          test -f "$RELEASE_PATH/public/build/manifest.json"
          test -d "$HOME/laravel/storage"
          test -f "$HOME/laravel/.env"
          rm -f "$RELEASE_PATH/.env" "$RELEASE_PATH/storage"
          ln -s "$HOME/laravel/.env" "$RELEASE_PATH/.env"
          ln -s "$HOME/laravel/storage" "$RELEASE_PATH/storage"
          mkdir -p "$RELEASE_PATH/bootstrap/cache"

          cd "$RELEASE_PATH"
          composer check-platform-reqs --no-dev
          php artisan optimize
          REMOTE

      - name: Ativar release e guardar rollback
        if: github.event_name != 'pull_request'
        id: activate
        env:
          API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
          API_ACCOUNT: meu-bolso
          SITE_ID: '1102810'
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$API_TOKEN"
          API="https://api.alwaysdata.com/v1/site/${SITE_ID}/"
          AUTH="${API_TOKEN} account=${API_ACCOUNT}:"

          OLD_PATH=$(curl --fail --silent --show-error --basic --user "$AUTH" "$API" | jq -er '.path')
          NEW_PATH="releases/release-${DEPLOY_SHA:0:7}/public/"
          test "$OLD_PATH" != "$NEW_PATH"
          printf 'old_path=%s\n' "$OLD_PATH" >> "$GITHUB_OUTPUT"

          curl --fail --silent --show-error --basic --user "$AUTH" \
            --request PATCH \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg path "$NEW_PATH" '{path: $path}')" \
            "$API"

      - name: Reiniciar, smoke test e rollback automático
        if: github.event_name != 'pull_request'
        env:
          API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
          API_ACCOUNT: meu-bolso
          SITE_ID: '1102810'
          OLD_PATH: ${{ steps.activate.outputs.old_path }}
        run: |
          set -u
          API="https://api.alwaysdata.com/v1/site/${SITE_ID}/"
          AUTH="${API_TOKEN} account=${API_ACCOUNT}:"

          rollback() {
            echo 'Falha após ativação; a restaurar a release anterior.'
            curl --fail --silent --show-error --basic --user "$AUTH" \
              --request PATCH \
              --header 'Content-Type: application/json' \
              --data "$(jq -n --arg path "$OLD_PATH" '{path: $path}')" \
              "$API" || true
            curl --fail --silent --show-error --basic --user "$AUTH" \
              --request POST "${API}restart/" || true
          }

          if ! curl --fail --silent --show-error --basic --user "$AUTH" \
              --request POST "${API}restart/"; then
            rollback
            exit 1
          fi

          if ! curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-connrefused \
              --max-time 30 https://meu-bolso.alwaysdata.net/login >/dev/null; then
            rollback
            exit 1
          fi

          echo 'Deploy validado: /login respondeu HTTP 200.'
