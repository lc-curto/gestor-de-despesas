name: Laravel quality
on:
  push:
    branches: [feature/migracao-laravel]
  pull_request:
    branches: [main]
    paths:
      - 'laravel/**'
      - '.github/workflows/laravel.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meu_bolso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, xml, ctype, fileinfo, openssl, tokenizer
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run migrations and tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: meu_bolso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
