name: Laravel quality

on:
  push:
    branches: [feature/migracao-laravel, feature/categorias-crud, feature/dashboard-sidebar-redesign, audit/exclusoes-movimentos]
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml'
      - 'vite.config.js'
      - '.env.example'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/laravel.yml'

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meu_bolso_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, xml, ctype, fileinfo, openssl, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies and check JavaScript
        run: |
          npm ci
          npm run check
          npm run test:js

      - name: Run migrations and tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: meu_bolso_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan test --display-all-issues --log-junit /tmp/phpunit-junit.xml --log-events-verbose-text /tmp/phpunit-events.txt
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/phpunit-junit.xml').getroot()
          events = open('/tmp/phpunit-events.txt', encoding='utf-8').read().splitlines()
          for index, line in enumerate(events):
              if 'risky' in line.lower() or 'considered risky' in line.lower():
                  print('PHPUnit event detail:')
                  print('\\n'.join(events[max(0, index - 3):min(len(events), index + 6)]))
          targets = (
              'card_purchases_are_in_card_history_not_movements_and_invoice_payment_remains_visible',
              'acceptance_dashboard_and_movements_read_canonical_financial_movements',
          )
          for case in root.iter('testcase'):
              if any(target in case.attrib.get('name', '') for target in targets):
                  print('PHPUnit detail:', case.attrib)
                  for issue in case:
                      print(f"  {issue.tag}: {issue.attrib}")
                      if issue.text:
                          print(issue.text.strip())
              for issue in case:
                  if issue.tag in ('error', 'failure', 'skipped'):
                      print(f"{case.attrib.get('classname')}::{case.attrib.get('name')} [{issue.tag}] {issue.attrib.get('type', '')}")
                      if issue.text:
                          print(issue.text.strip())
          PY
